services:
  - type: web
    name: quick-fix-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_HOST
        value: "mysql-77b3057-quickfixdatabase.i.aivencloud.com"
      - key: DB_PORT
        value: "23326"
      - key: DB_NAME
        value: "defaultdb"
      - key: DB_USERNAME
        value: "avnadmin"
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: "REQUIRED"
      - key: HIBERNATE_DDL_AUTO
        value: "update"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://quick-fix-frontend-9hfu.vercel.app,http://localhost:5173,http://localhost:5174"
