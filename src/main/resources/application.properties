spring.application.name=quick-fix

# Server Port - Render injects PORT; defaults to 8081 for local development
server.port=${PORT:8081}

# Database Configuration using environment variables with local defaults
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quickfix_db}?sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# CORS Configuration (allows Vercel domain and local Vite ports 5174/5173 by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://quick-fix-frontend-9hfu.vercel.app,http://localhost:5174,http://localhost:5173}

# Error responses
server.error.include-message=always
server.error.include-binding-errors=always
